<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportMap</title>
    <script src="../js/idioma.js"></script>
    <script src="../js/tema.js"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header><nav id="menu"></nav><select id="idioma">
            <option value="pt">Português</option>
            <option value="en">English</option>
        </select><button id="tema"></button></header>
    <main>
        <div class="caixa">
            <h1>Criar time</h1>
            <label for="nome">Nome</label>
            <input type="text" id="nome">
            <label for="sigla">Sigla</label>
            <input type="text" id="sigla">
            <label for="cidade">Cidade</label>
            <input type="text" id="cidade">
            <label for="descricao">Descrição</label>
            <textarea id="descricao"></textarea>
            <button id="enviar">Salvar</button>
            <a href="time.html">Voltar</a>
        </div>
    </main>
    <script src="../js/valida_sessao.js"></script>
    <script src="../js/time_novo.js"></script>
</body>
</html>
