<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportMap</title>
    <script src="../js/idioma.js"></script>
    <script src="../js/tema.js"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <nav id="menu"></nav>
        <select id="idioma">
            <option value="pt">Português</option>
            <option value="en">English</option>
        </select>
        <button id="tema"></button>
    </header>
    <main>
        <div class="cabecalho">
            <h1>Encontre uma partida</h1>
            <a href="partida_novo.html">Criar partida</a>
        </div>
        <div class="caixa filtros">
            <div>
                <label for="local">Local</label>
                <input type="text" id="local">
            </div>
            <div>
                <label for="data">Data</label>
                <input type="date" id="data">
            </div>
            <div>
                <label for="hora">A partir de</label>
                <input type="time" id="hora">
            </div>
            <div>
                <label for="modalidade">Modalidade</label>
                <select id="modalidade"><option value="">Todas</option></select>
            </div>
            <button id="filtrar">Filtrar</button>
        </div>
        <div id="lista"></div>
    </main>
    <script src="../js/valida_sessao.js"></script>
    <script src="../js/index.js"></script>
</body>
</html>
