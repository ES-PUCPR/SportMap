<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportMap</title>
    <script src="../js/idioma.js"></script>
    <script src="../js/tema.js"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <nav id="menu"></nav>
        <select id="idioma">
            <option value="pt">Português</option>
            <option value="en">English</option>
        </select>
        <button id="tema"></button>
    </header>
    <main>
        <div class="caixa">
            <h1>Cadastrar quadra</h1>
            <label for="nome_quadra">Nome</label>
            <input type="text" id="nome_quadra">
            <label for="endereco">Endereço</label>
            <input type="text" id="endereco" placeholder="Rua, número e cidade">
            <input type="hidden" id="latitude">
            <input type="hidden" id="longitude">
            <label for="tipo_quadra">Piso</label>
            <input type="text" id="tipo_quadra">
            <button id="enviar">Salvar</button>
            <a href="quadra.html">Voltar</a>
        </div>
    </main>
    <script src="../js/valida_sessao.js"></script>
    <script src="../js/endereco.js"></script>
    <script src="../js/quadra_novo.js"></script>
</body>
</html>
