<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../global.css">
    <title>Lobby</title>
</head>
<body>
    <main class="container-principal">
        <section class="area-controles">
            <input type="time" id="horario" placeholder="Horario">
            <input type="text" id="nome_lobby" placeholder="Nome da Partida">
            <input type="text" id="local" placeholder="Local">
            <input type="number" id="qnt_pessoas" placeholder="Quantidade de Pessoas">
            <button id="btn_add">Add</button>
            <div id="edit" style="display: inline-block;"></div>
        </section>

        <section class="area-resultados">
            <table border="1">
                <thead>
                    <tr>
                        <th>Horário</th>
                        <th>Nome do Lobby</th>
                        <th>Local</th>
                        <th>Quantidade de Pessoas</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="t_add"></tbody>
            </table>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
