<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportMap</title>
    <script src="../js/idioma.js"></script>
    <script src="../js/tema.js"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header><b class="marca">Sport<span>Map</span></b><select id="idioma">
            <option value="pt">Português</option>
            <option value="en">English</option>
        </select><button id="tema"></button></header>
    <main class="login">
        <div class="caixa">
            <h1>Entrar</h1>
            <label for="email">E-mail</label>
            <input type="email" id="email">
            <label for="senha">Senha</label>
            <input type="password" id="senha">
            <button id="enviar">Entrar</button>
            <p>Ainda não tem conta?</p>
            <a href="usuario_novo.html">Cadastre-se</a>
        </div>
    </main>
    <script src="../js/usuario_login.js"></script>
</body>
</html>
