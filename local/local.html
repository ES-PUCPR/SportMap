<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../global.css">
    <title>Quadras</title>
</head>
<body>
    <main class="container-principal">
        <section class="area-controles">
            <input type="text" id="nome_quadra" placeholder="Nome da Quadra">
            <input type="text" id="endereco" placeholder="Endereço">
            <input type="text" id="responsavel" placeholder="Responsável">
            <input type="number" id="preco_hora" placeholder="Preço por Hora">
            <input type="text" id="tipo_quadra" placeholder="Tipo da Quadra">
            <button id="btn_add">Add</button>
            <div id="edit" style="display: inline-block;"></div>
        </section>

        <section class="area-resultados">
            <table border="1">
                <thead>
                    <tr>
                        <th>Nome da Quadra</th>
                        <th>Endereço</th>
                        <th>Responsável</th>
                        <th>Preço por Hora</th>
                        <th>Tipo da Quadra</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="t_add"></tbody>
            </table>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
