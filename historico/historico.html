<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../global.css">
    <title>Histórico de Partidas</title>
</head>
<body>
    <main class="container-principal">
        <section class="area-controles">
            <input type="text" id="time1" placeholder="Time 1">
            <input type="text" id="time2" placeholder="Time 2">
            <input type="date" id="dia" placeholder="Dia">
            <input type="time" id="hora" placeholder="Hora">
            <input type="text" id="placar" placeholder="Placar 0-0">
            <input type="text" id="vencedor" placeholder="Time Vencedor">
            <input type="text" id="local" placeholder="Local">
            <button id="btn_add">Add</button>
            <div id="edit" style="display: inline-block;"></div>
        </section>

        <section class="area-resultados">
            <table border="1">
                <thead>
                    <tr>
                        <th>Time 1</th>
                        <th>Time 2</th>
                        <th>Dia</th>
                        <th>Hora</th>
                        <th>Placar</th>
                        <th>Time vencedor</th>
                        <th>Local</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="t_add"></tbody>
            </table>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
