<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="global.css">
    <title>SportMap</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        #conteudo {
            flex: 1;
            width: 100%;
            border: none;
        }
        .navbar a.ativo {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="lobby/lobby.html" target="conteudo">Lobby</a>
        <a href="local/local.html" target="conteudo">Local</a>
        <a href="historico/historico.html" target="conteudo">Histórico</a>
        <a href="jogador/jogador.html" target="conteudo">Jogador</a>
        <a href="time/time.html" target="conteudo">Time</a>
    </nav>

    <iframe id="conteudo" name="conteudo" src="lobby/lobby.html"></iframe>

    <script>
        const links = document.querySelectorAll(".navbar a");
        links.forEach(link => {
            link.addEventListener("click", () => {
                links.forEach(l => l.classList.remove("ativo"));
                link.classList.add("ativo");
            });
        });
        links[0].classList.add("ativo");
    </script>
</body>
</html>
