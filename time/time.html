<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../global.css">
    <title>Times</title>
</head>
<body>
    <main class="container-principal">
        <section class="area-controles">
            <input type="text" id="nome_time" placeholder="Nome do Time">
            <input type="text" id="modalidade" placeholder="Modalidade">
            <input type="text" id="capitao" placeholder="Capitão">
            <input type="number" id="qnt_jogadores" placeholder="Qtd. de Jogadores">
            <input type="text" id="cidade" placeholder="Cidade">
            <button id="btn_add">Add</button>
            <div id="edit" style="display: inline-block;"></div>
        </section>

        <section class="area-resultados">
            <table border="1">
                <thead>
                    <tr>
                        <th>Nome do Time</th>
                        <th>Modalidade</th>
                        <th>Capitão</th>
                        <th>Qtd. de Jogadores</th>
                        <th>Cidade</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="t_add"></tbody>
            </table>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
